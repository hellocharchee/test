
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Audrey No. 1</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- html2canvas and JSZip for Exporting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        /* --- Styling keyframe animations... --- */
        /* --- Animations --- */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        @keyframes breathe {
            0%, 100% { opacity: 0.3; transform: scale(1) translate(-50%, -50%); }
            50% { opacity: 0.6; transform: scale(1.1) translate(-50%, -50%); }
        }
        @keyframes gradientPan {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        @keyframes headerPulseGlow {
            0%, 100% { filter: drop-shadow(0 0 2px rgba(251,146,60,0.4)); }
            50% { filter: drop-shadow(0 0 15px rgba(251,146,60,1)); }
        }
        @keyframes splashPulseGlow {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(251,146,60,0.3)); }
            50% { filter: drop-shadow(0 0 40px rgba(251,146,60,1)); }
        }
        @keyframes printShake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-1px, 1px) rotate(-0.5deg); }
            50% { transform: translate(1px, -1px) rotate(0.5deg); }
            75% { transform: translate(-1px, -1px) rotate(0deg); }
        }
        @keyframes scanDown {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; height: 4px; box-shadow: 0 0 30px 5px rgba(255,255,255,0.8); }
            90% { opacity: 1; height: 4px; box-shadow: 0 0 30px 5px rgba(255,255,255,0.8); }
            100% { top: 100%; opacity: 0; }
        }

        /* --- Styling stack engine components... --- */
        /* --- STACK ENGINE ANIMATIONS --- */
        @keyframes tossRight {
            0% { transform: translateX(0) rotate(var(--rot)) scale(1); opacity: 1; }
            100% { transform: translateX(150vw) rotate(45deg) scale(0.9); opacity: 0; }
        }
        .animate-toss {
            animation: tossRight 0.6s forwards cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .stack-page {
            position: absolute;
            inset: 0;
            border-radius: 0.5rem; 
            transition: background-color 0.5s ease, border-color 0.5s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            pointer-events: none; /* Let clicks pass through */
        }
        .stack-page.light-theme {
            background-color: #f4f0e6;
            border: 1px solid #d6d3c4;
        }
        .stack-page.dark-theme {
            background-color: #1a1a19;
            border: 1px solid #333333;
        }

        /* --- Styling animation utilities... --- */
        /* --- Animation Utilities --- */
        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-header-pulse { animation: headerPulseGlow 3s ease-in-out infinite; }
        .animate-splash-pulse { animation: splashPulseGlow 3s ease-in-out infinite; }
        .animate-print-shake { animation: printShake 0.15s infinite; }
        
        .print-scanner {
            position: absolute;
            left: 0; right: 0;
            background: #ffffff;
            z-index: 50;
            animation: scanDown 0.8s linear forwards;
            pointer-events: none;
        }

        .bg-gradient-pan {
            background-size: 200% 200%;
            animation: gradientPan 8s ease infinite;
        }

        /* --- Styling typography and editor logic... --- */
        /* --- Typography Tweaks --- */
        .fix-cursive-clip {
            text-shadow: 0px 10px 10px rgba(0,0,0,0.01);
            padding-bottom: 20px;
        }

        /* --- WYSIWYG Editor Strict Rules --- */
        .ig-editor { font-family: 'Inter', sans-serif; }
        .ig-editor[data-placeholder]:empty:before {
            content: attr(data-placeholder);
            color: #525252;
            cursor: text;
        }
        
        /* Font size mappings mapped from document.execCommand */
        .ig-editor font[size="7"] { font-size: 2.5rem; line-height: 1.1; font-weight: bold; }
        .ig-editor font[size="6"] { font-size: 2rem; line-height: 1.2; font-weight: bold; }
        .ig-editor font[size="5"] { font-size: 1.5rem; line-height: 1.3; font-weight: bold; }
        .ig-editor font[size="4"] { font-size: 1.25rem; line-height: 1.4; font-weight: 500; }
        .ig-editor font[size="3"] { font-size: 1rem; line-height: 1.5; }
        .ig-editor font[size="2"] { font-size: 0.875rem; line-height: 1.5; }
        .ig-editor font[size="1"] { font-size: 0.75rem; line-height: 1.5; }
        
        /* Strict element control inside the canvas to prevent overflow */
        .ig-editor p, .ig-editor div { margin-bottom: 0.75em; max-width: 100% !important; }
        .ig-editor:focus { outline: none; }
        
        /* Scrollbar hiding & Rigid Layout for accurate exporting */
        .ig-editor::-webkit-scrollbar { display: none !important; }
        .ig-editor {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
            overflow: hidden !important; 
            overflow-x: hidden !important;
            overflow-y: hidden !important;
            overflow-wrap: anywhere !important;
            word-wrap: break-word !important;
            word-break: break-word !important;
        }
        .ig-editor * {
            max-width: 100% !important;
            overflow-wrap: anywhere !important;
            word-wrap: break-word !important;
        }

        /* Lever Component Styles */
        .inset-inner-shadow { box-shadow: inset 0 10px 20px rgba(0,0,0,0.8); }

        /* --- Styling metal textures... --- */
        /* --- METAL SKIN ANIMATIONS & STYLES --- */
        .metal-container {
            position: relative;
            overflow: hidden;
            border: none !important;
            background: transparent !important;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        .metal-bg {
            position: absolute;
            inset: 0;
            background-image: url('https://wifeywriter-audreyno1-texturepurplefuckingmetal.s3.us-east-1.amazonaws.com/Animal+Print.jfif');
            background-size: cover; /* Changed to cover to eliminate repeating seams */
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
            /* Flatten the contrast slightly so the light beam does the heavy lifting */
            filter: contrast(0.9) brightness(0.9);
        }
        /* Subtle, flat edge instead of a deep rounded bevel */
        .metal-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), inset 0 -1px 0 rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 1;
        }
        /* Widened and highly feathered "ghost" light reflection */
        .metal-light {
            position: absolute;
            top: -50px; bottom: -50px; 
            width: 400px; /* Much wider for a softer feather */
            left: -100px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255,255,255,0.0) 10%, 
                rgba(255,255,255,0.3) 40%, 
                rgba(255,255,255,0.6) 50%, 
                rgba(255,255,255,0.3) 60%, 
                rgba(255,255,255,0.0) 90%, 
                transparent 100%);
            mix-blend-mode: overlay;
            animation: sweepLight 10s infinite ease-in-out;
            pointer-events: none;
            z-index: 2;
        }
        @keyframes sweepLight {
            0% { transform: translateX(-300px) rotate(15deg); }
            40% { transform: translateX(150vw) rotate(15deg); } 
            100% { transform: translateX(150vw) rotate(15deg); } 
        }
        /* Elevates the UI so it isn't buried under the metal layers */
        .metal-content {
            position: relative;
            z-index: 10;
        }

        /* --- Styling engraved metal text effects... --- */
        .text-engraved {
            color: #242424 !important;
            text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.4), -1px -1px 1px rgba(0, 0, 0, 0.7) !important;
            transition: all 0.2s ease;
        }
        button:hover .text-engraved,
        button:hover.text-engraved,
        .text-engraved:hover {
            color: #050505 !important;
            text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.6), -1px -1px 2px rgba(0, 0, 0, 0.9) !important;
        }
        button:disabled .text-engraved,
        button:disabled.text-engraved {
            color: #3a3a3a !important;
            text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.2), -1px -1px 1px rgba(0, 0, 0, 0.3) !important;
            opacity: 0.6;
        }
        .btn-engraved {
            background: rgba(0, 0, 0, 0.05);
            color: #242424 !important;
            text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.4), -1px -1px 1px rgba(0, 0, 0, 0.7) !important;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.5), inset -1px -1px 2px rgba(255,255,255,0.4);
            border: 1px solid rgba(0,0,0,0.4);
            border-bottom: 1px solid rgba(255,255,255,0.3);
            border-right: 1px solid rgba(255,255,255,0.3);
        }
        .btn-engraved:hover {
            background: rgba(0, 0, 0, 0.12);
            color: #000 !important;
        }
        .btn-engraved:active {
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.8), inset -1px -1px 2px rgba(255,255,255,0.2);
        }
        .track-engraved {
            background: rgba(0, 0, 0, 0.08);
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.6), inset -1px -1px 2px rgba(255,255,255,0.3);
            border: 1px solid rgba(0,0,0,0.4);
            border-bottom-color: rgba(255,255,255,0.2);
            border-right-color: rgba(255,255,255,0.2);
        }
        .laser-active, .laser-active i, .laser-active span {
            color: #ff3300 !important;
            text-shadow: 0 0 6px rgba(255,50,0,0.8), 1px 1px 0px rgba(255, 255, 255, 0.2), -1px -1px 1px rgba(0, 0, 0, 0.7) !important;
        }
        .divider-engraved {
            background: rgba(0,0,0,0.3);
            border-right: 1px solid rgba(255,255,255,0.3);
        }

        /* ── Camo engine ─────────────────────────────────────────────────── */
        #engine-mount {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            isolation: isolate;
        }
        #engine-mount img {
            max-width: none;
            user-select: none;
            -webkit-user-drag: none;
        }
        #paper-stage {
            position: absolute;
            left: 50%;
            top: 49%;
            z-index: 30;
            display: flex;
            width: 34%;
            transform: translate(-50%, -50%);
            flex-direction: column;
            align-items: center;
            pointer-events: auto;
        }
        #paper-stage #toolbar {
            position: absolute;
            bottom: calc(100% + 0.55rem);
            left: 50%;
            z-index: 31;
            width: max-content;
            max-width: min(92vw, 54rem);
            transform: translateX(-50%);
        }
        #main-app,
        #main-app main {
            overflow: hidden !important;
        }
        #piston-left,
        #piston-right {
            z-index: 0;
            filter: blur(1.6px) brightness(0.78) saturate(0.85) contrast(0.95);
            opacity: 0.94;
            will-change: top;
        }
        #fan-left,
        #fan-right {
            z-index: 20;
            will-change: transform;
        }
    </style>
</head>
<body class="bg-neutral-950 text-white font-sans w-full h-screen flex flex-col overflow-hidden relative overflow-x-hidden">

    <!-- --- Rendering immersive backgrounds... --- -->
    <!-- PLACES MODE BACKGROUND -->
    <div id="places-bg-container" class="fixed inset-0 z-0 opacity-0 pointer-events-none transition-opacity duration-1000">
        <div id="places-bg" class="absolute inset-0 bg-cover bg-center scale-110 transition-all duration-300" style="background-image: url('https://i.imgur.com/5UFzerv.jpeg'); filter: blur(8px);"></div>
        <div class="absolute inset-0 bg-black/50"></div>
    </div>

    <!-- WEATHER CANVAS LAYER -->
    <canvas id="weather-canvas" class="fixed top-0 left-0 z-0 pointer-events-none opacity-0 transition-opacity duration-1000"></canvas>

    <!-- --- Rendering printing machine overlay... --- -->
    <!-- PRINTING PRESS LEVER OVERLAY -->
    <div id="lever-modal" class="fixed inset-0 z-[100] hidden flex-col items-center justify-center bg-black/85 backdrop-blur-md transition-opacity duration-500 opacity-0 select-none">
        <div class="text-center mb-12 animate-float">
            <h2 class="text-4xl md:text-5xl font-bold text-white mb-3" style="font-family: 'Playfair Display', serif;">The Printing Press</h2>
            <p class="text-neutral-400 font-mono tracking-widest uppercase text-sm">Pull lever to mint your story</p>
        </div>
        
        <!-- The Machine -->
        <div class="relative w-32 h-64 bg-neutral-900 border-4 border-neutral-700 rounded-xl shadow-[0_0_50px_rgba(0,0,0,0.8)] flex justify-center p-2 mb-10">
            <!-- The Track -->
            <div class="w-6 h-full bg-black rounded-sm inset-inner-shadow relative">
                <!-- The Gold Bar Handle -->
                <div id="lever-handle" class="absolute top-0 left-1/2 -translate-x-1/2 w-48 h-12 bg-gradient-to-b from-yellow-300 via-yellow-500 to-yellow-700 rounded-sm cursor-pointer shadow-[0_15px_30px_rgba(0,0,0,0.8),inset_0_2px_5px_rgba(255,255,255,0.9),inset_0_-2px_5px_rgba(0,0,0,0.5)] border-b-[4px] border-yellow-900 border-t border-t-white flex items-center justify-center hover:brightness-110 active:cursor-grabbing transform transition-transform" style="touch-action: none;">
                    <!-- Machined Grip Lines -->
                    <div class="flex gap-4 opacity-70">
                        <div class="w-1.5 h-8 bg-yellow-900 rounded-full shadow-[1px_0_0_rgba(255,255,255,0.6)]"></div>
                        <div class="w-1.5 h-8 bg-yellow-900 rounded-full shadow-[1px_0_0_rgba(255,255,255,0.6)]"></div>
                        <div class="w-1.5 h-8 bg-yellow-900 rounded-full shadow-[1px_0_0_rgba(255,255,255,0.6)]"></div>
                        <div class="w-1.5 h-8 bg-yellow-900 rounded-full shadow-[1px_0_0_rgba(255,255,255,0.6)]"></div>
                        <div class="w-1.5 h-8 bg-yellow-900 rounded-full shadow-[1px_0_0_rgba(255,255,255,0.6)]"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <button id="btn-cancel-print" class="px-6 py-2 rounded-full border border-neutral-700 text-neutral-400 hover:text-white hover:bg-neutral-800 transition-colors">Abort Sequence</button>
    </div>

    <!-- SPLASH SCREEN -->
    <div id="splash-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-gradient-to-br from-[#3b2314] to-[#1a0f09] overflow-hidden transition-opacity duration-700">
        <div class="absolute top-1/2 left-1/4 w-[500px] h-[500px] bg-orange-600/20 rounded-full blur-[100px] animate-breathe"></div>
        <div class="absolute top-1/2 left-3/4 w-[500px] h-[500px] bg-amber-600/20 rounded-full blur-[100px] animate-breathe" style="animation-delay: -4s;"></div>
        
        <div class="z-10 flex flex-col items-center text-center px-4 max-w-2xl animate-float">
            <div class="bg-[#5c341e]/40 backdrop-blur-md border border-[#8a4e2d] p-6 rounded-3xl mb-8 shadow-2xl flex items-center justify-center">
                <!-- Glowing splash heart icon -->
                <i class="ph-fill ph-heart text-5xl text-orange-400 animate-splash-pulse"></i>
            </div>
            
            <h1 class="mb-12 flex flex-col items-center">
                <!-- Wifey! Logo -->
                <span class="text-7xl md:text-9xl bg-clip-text text-transparent bg-gradient-to-r from-orange-400 via-amber-300 to-rose-400 bg-gradient-pan drop-shadow-sm fix-cursive-clip pb-6 block" style="font-family: 'Pacifico', cursive; line-height: 1.5; padding-bottom: 24px;">
                    Wifey!
                </span>
            </h1>
            
            <button id="btn-start" class="group relative inline-flex items-center justify-center gap-3 px-8 py-4 bg-[#e76f51] text-white font-bold rounded-full text-lg transition-all duration-300 hover:scale-105 hover:bg-[#f4a261] hover:text-[#2b1810] hover:shadow-[0_0_40px_rgba(231,111,81,0.5)] active:scale-95 overflow-hidden border border-[#f4a261]/50">
                <span class="relative z-10 flex items-center gap-2">
                    Start Writing
                    <i class="ph-bold ph-arrow-right group-hover:translate-x-1 transition-transform"></i>
                </span>
                <div class="absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/30 to-transparent group-hover:animate-[shimmer_1.5s_infinite]"></div>
            </button>
        </div>

        <div class="absolute bottom-4 text-[#8a4e2d]/60 text-xs font-mono tracking-widest z-10 pointer-events-none select-none">The Audrey No. 1</div>
    </div>

    <!-- --- Rendering main app layout... --- -->
    <!-- MAIN APP WRAPPER -->
    <div id="main-app" class="hidden flex-col h-full w-full relative z-10 transition-transform overflow-hidden">
        
        <!-- Header -->
        <header class="flex items-center justify-between p-4 shrink-0 z-20 transition-colors duration-500 metal-container" id="main-header">
            <div class="metal-bg"></div>
            <div class="metal-light"></div>
            
            <div class="flex items-center gap-3 metal-content">
                <!-- Removed animation and applied text-engraved for lazered effect -->
                <i class="ph-fill ph-heart text-engraved text-2xl"></i>
                <h1 class="text-xl font-bold tracking-tight text-engraved hidden md:block" style="font-family: 'Pacifico', cursive;">Wifey!</h1>
            </div>
            <div class="flex items-center gap-2 md:gap-4 flex-wrap metal-content">
                
                <div id="places-controls" class="hidden items-center gap-2 bg-neutral-950/60 px-3 py-1.5 rounded-full border border-neutral-700 backdrop-blur-sm mr-2 transition-all duration-300">
                    <button id="btn-places-shuffle" class="text-neutral-400 hover:text-white transition-colors flex items-center justify-center p-1" title="Randomize Place">
                        <i class="ph ph-shuffle text-lg"></i>
                    </button>
                    <div id="shuffle-divider" class="w-px h-5 bg-neutral-700 mx-1"></div>
                    <i class="ph ph-aperture text-neutral-400" title="Focus Knob"></i>
                    <input type="range" id="focus-slider" min="0" max="20" value="8" class="w-16 md:w-20 accent-blue-500 cursor-pointer" title="Adjust Background Blur">
                    <div class="w-px h-5 bg-neutral-700 mx-1"></div>
                    <i class="ph ph-magnifying-glass-plus text-neutral-400" title="Zoom Knob"></i>
                    <input type="range" id="zoom-slider" min="100" max="150" value="110" class="w-16 md:w-20 accent-blue-500 cursor-pointer" title="Adjust Background Zoom">
                </div>
                
                <button id="btn-places" class="flex items-center gap-2 text-sm text-engraved transition-colors">
                    <i class="ph ph-image text-lg"></i> <span class="hidden md:inline">Places</span>
                </button>
                
                <div class="w-px h-6 divider-engraved mx-1"></div>
                
                <button id="btn-theme" class="flex items-center gap-2 text-sm text-engraved transition-colors">
                    <i class="ph ph-sun text-lg"></i> <span class="hidden md:inline">Theme</span>
                </button>

                <div class="w-px h-6 divider-engraved mx-1"></div>

                <button id="btn-weather" class="flex items-center gap-2 text-sm text-engraved transition-colors" title="Toggle Weather">
                    <i class="ph ph-cloud-rain text-lg"></i> <span class="hidden md:inline">Weather</span>
                </button>

                <div class="w-px h-6 divider-engraved mx-1"></div>
                
                <button id="btn-dictionary" class="flex items-center gap-2 text-sm text-engraved transition-colors">
                    <i class="ph ph-book-open-text text-lg"></i> <span class="hidden md:inline">Dictionary</span>
                </button>

                <div class="w-px h-6 divider-engraved mx-1 hidden md:block"></div>

                <!-- SAVE / LOAD MANUSCRIPT BUTTONS -->
                <button id="btn-load" class="flex items-center gap-2 text-sm text-engraved transition-colors" title="Load Manuscript">
                    <i class="ph-bold ph-upload-simple text-lg"></i> <span class="hidden md:inline font-semibold">Load</span>
                </button>
                <input type="file" id="file-load-input" accept=".audrey" class="hidden">
                
                <button id="btn-save" class="flex items-center gap-2 text-sm text-engraved transition-colors" title="Save Manuscript">
                    <i class="ph-bold ph-floppy-disk text-lg"></i> <span class="hidden md:inline font-semibold">Save</span>
                </button>

                <!-- EXPORT BUTTON -->
                <button id="btn-export" class="flex items-center gap-2 btn-engraved px-3 md:px-4 py-2 rounded-lg font-bold transition-colors ml-2">
                    <i class="ph ph-printer text-lg"></i> <span class="hidden md:inline">Export (ZIP)</span>
                </button>
            </div>
        </header>

        <main class="flex-1 flex flex-col relative z-10 overflow-hidden">
            <!-- CAMO ENGINE + PAPER BAY -->
            <div id="engine-mount">
                <div id="engine-stage" class="pointer-events-none relative mx-auto w-[90%] max-w-[2752px]" style="aspect-ratio: 2752 / 1536;">
                    <!-- Left Drive Shaft (Behind the block) -->
                    <img id="piston-left" src="https://wifeyengine-audreyno1-camoengine.s3.us-east-1.amazonaws.com/Wifey+Camo+Engine/Camo+Engine+Shaft+Left.png" class="absolute z-0" style="width: 55%; top: 50%; left: 10.9%; transform: translate(-50%, -50%);" alt="Left Piston">

                    <!-- Right Drive Shaft -->
                    <img id="piston-right" src="https://wifeyengine-audreyno1-camoengine.s3.us-east-1.amazonaws.com/Wifey+Camo+Engine/Camo+Engine+Shaft+Right.png" class="absolute z-0" style="width: 55%; top: 50%; left: 89.1%; transform: translate(-50%, -50%);" alt="Right Piston">

                    <!-- Base Engine Image -->

        // Global UI Notification System
        function showToast(msg) {
            toastMsg.textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0', 'bg-blue-600', 'bg-red-600', 'bg-emerald-600');
            
            if(msg.includes("limit") || msg.includes("full") || msg.includes("Boundary") || msg.includes("overflow") || msg.includes("Error")) {
                toast.classList.add('bg-red-600');
            } else if(msg.includes("saved") || msg.includes("loaded")) {
                toast.classList.add('bg-emerald-600');

        /* --- Configuring Save/Load Manuscript Logic... --- */
        // SAVE MANUSCRIPT
        btnSave.addEventListener('click', () => {

            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const projectData = JSON.parse(event.target.result);
                    
                    // Restore Data
                    pages = projectData.pages || [''];
                    coverImage = projectData.coverImage || null;
                    
                    // Restore Theme
                    if (projectData.theme && projectData.theme !== theme) {
                        theme = projectData.theme;
                        updateThemeVisuals();
                    }
                    
                    // Reset View to Cover Slide
                    activePageIndex = 0;
                    
                    // Restore Cover Image Visuals
                    if (coverImage) {
                        coverImagePreview.src = coverImage;
                        coverImagePreview.classList.remove('hidden');
                        coverUploadLabel.classList.add('opacity-0', 'hover:opacity-100');
                        coverUploadLabel.classList.remove('bg-neutral-900/80');
                    } else {
                        coverImagePreview.src = '';
                        coverImagePreview.classList.add('hidden');
                        coverUploadLabel.classList.remove('opacity-0', 'hover:opacity-100');
                        coverUploadLabel.classList.add('bg-neutral-900/80');
                    }
                    
                    // Fire master updates to rebuild UI and Stack
                    updateUI();
                    syncStack(0);
                    showToast('Manuscript loaded successfully.');
                    
                } catch (err) {
                    showToast('Error: Invalid or corrupted manuscript file.');
                }
            };
            reader.readAsText(file);
            fileLoadInput.value = ""; // Reset input so you can load the same file again if needed
        });


        /* --- Configuring formatting helpers... --- */
        function applyCommand(command, value = null) {
            document.execCommand(command, false, value);
            if (editor.scrollHeight > editor.clientHeight + 2 || editor.textContent.length > MAX_CHARS) {
                document.execCommand('undo');
                showToast("Formatting blocked: Text exceeds slide boundaries!");
            } else {
                saveContent();
            }
            editor.focus();
        }
        function applyFont(fontName) { applyCommand('fontName', fontName); fontMenu.classList.add('hidden'); }
        function applySize(size) { applyCommand('fontSize', size); }

        /* --- Configuring Stack Engine physics... --- */
        // Syncs the DOM pages beneath the canvas to the current slide number
        function syncStack(targetPageCount) {
            // Add pages if we are moving forward
            while (stackData.length < targetPageCount) {
                // Generate slightly messy random rotations and offsets
                const rot = (Math.random() * 3 - 1.5).toFixed(2); 
                const x = (Math.random() * 4 - 2).toFixed(2); 
                const y = (Math.random() * 4 - 2).toFixed(2); 
                stackData.push({ rot, x, y });
                
                const el = document.createElement('div');
                el.className = `stack-page ${theme === 'light' ? 'light-theme' : 'dark-theme'}`;
                el.style.setProperty('--rot', `${rot}deg`);
                el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
                el.style.zIndex = stackData.length - 1; 
                stackContainer.appendChild(el);
            }
            
            // Remove pages if we are moving backward (Toss Animation)
            let delay = 0;
            while (stackData.length > targetPageCount) {
                stackData.pop();
                const el = stackContainer.children[stackData.length]; // Get top page
                if (el) {
                    setTimeout(() => {
                        el.classList.add('animate-toss');
                        setTimeout(() => {
                            if (el.parentNode === stackContainer) stackContainer.removeChild(el);
                        }, 650); // Clean up after animation finishes
                    }, delay);
                    delay += 100; // Stagger if multiple are tossing
                }
            }
        }

        /* --- Configuring strict editor bounds and pasting logic... --- */
        // Smart Paste: Limits text gracefully to avoid layout destruction
        editor.addEventListener('paste', (e) => {
            e.preventDefault();
            let html = e.clipboardData.getData('text/html');
            let text = e.clipboardData.getData('text/plain');
            
            // Clean up pasted formatting
            if (html) {
                html = html.replace(/&nbsp;/g, ' ').replace(/\u00A0/g, ' '); 
                let temp = document.createElement('div');
                temp.innerHTML = html;
                const elements = temp.querySelectorAll("*");
                elements.forEach(el => {
                    el.removeAttribute('style'); el.removeAttribute('class'); el.removeAttribute('id');
                    el.removeAttribute('width'); el.removeAttribute('height');
                });
                text = temp.textContent || temp.innerText || "";
            } else {
                text = text.replace(/\u00A0/g, ' ');
            }
            
            isReverting = true; 
            let currentLen = editor.textContent.length;
            let availableChars = MAX_CHARS - currentLen;
            
            if (availableChars <= 0) {
                showToast("Slide is full. Paste on the next slide.");
                isReverting = false; return;
            }

            // Binary search to find exactly how much pasted text fits in the physical box
            let words = text.split(/(\s+)/); 
            let low = 0; let high = words.length; let bestFitIndex = 0;
            
            while (low <= high) {
                let mid = Math.floor((low + high) / 2);
                let attempt = words.slice(0, mid).join('');
                document.execCommand('insertText', false, attempt);
                
                if (editor.scrollHeight <= editor.clientHeight + 2 && editor.textContent.length <= MAX_CHARS) {
                    bestFitIndex = mid; low = mid + 1; 
                } else {
                    high = mid - 1; 
                }
                document.execCommand('undo');
            }
            
            // Apply the safe amount
            let finalString = words.slice(0, bestFitIndex).join('');
            document.execCommand('insertText', false, finalString);
            isReverting = false;
            editor.dispatchEvent(new Event('input'));
            
            if (bestFitIndex < words.length) showToast(`Boundary hit! Copied ${finalString.length} chars. Paste remainder on next slide.`);
        });

        // Keyboard Limit Protection
        editor.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' || e.key === 'Delete' || e.ctrlKey || e.metaKey || e.key.includes('Arrow')) return;
            if (editor.textContent.length >= MAX_CHARS) {
                e.preventDefault(); showToast(`${MAX_CHARS} Character limit reached.`); return;
            }
            if (editor.scrollHeight > editor.clientHeight + 2) {
                e.preventDefault(); showToast("Physical slide bottom reached.");
            }
        });

        // Typing Monitor
        editor.addEventListener('input', (e) => {
            if (isReverting) return; 
            if (editor.scrollHeight > editor.clientHeight + 2 || editor.textContent.length > MAX_CHARS) {
                isReverting = true; document.execCommand('undo'); 
                showToast("Slide capacity reached."); isReverting = false;
            } else {
                saveContent(); updateCharCount();
            }
        });

        function saveContent() { if (activePageIndex > 0) pages[activePageIndex] = editor.innerHTML; }

        // Font Menu Toggle
        fontMenuBtn.addEventListener('click', () => fontMenu.classList.toggle('hidden'));
        document.addEventListener('click', (e) => {
            if (!fontMenuBtn.contains(e.target) && !fontMenu.contains(e.target)) fontMenu.classList.add('hidden');
        });

        /* --- Configuring slide navigation and UI updates... --- */
        btnPrev.addEventListener('click', () => { if (activePageIndex > 0) { activePageIndex--; updateUI(); }});
        btnNext.addEventListener('click', () => { if (activePageIndex < pages.length - 1) { activePageIndex++; updateUI(); }});
        
        btnAdd.addEventListener('click', () => {
            if (pages.length >= MAX_PAGES) { showToast('Maximum of 20 slides reached!'); return; }
            pages.push(''); activePageIndex = pages.length - 1; updateUI();
        });

        btnDelete.addEventListener('click', () => {
            if (activePageIndex === 0) {
                coverImage = null; coverImagePreview.src = ''; coverImagePreview.classList.add('hidden');
                coverUploadLabel.classList.remove('opacity-0', 'hover:opacity-100');
                coverUploadLabel.classList.add('bg-neutral-900/80');
            } else {
                if (pages.length === 2) pages[1] = '';
                else { pages.splice(activePageIndex, 1); activePageIndex--; }
            }
            updateUI();
        });

        // Cover Upload Handle
        coverUploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = () => {
                    coverImage = reader.result; coverImagePreview.src = coverImage; coverImagePreview.classList.remove('hidden');
                    coverUploadLabel.classList.remove('bg-neutral-900/80'); coverUploadLabel.classList.add('opacity-0', 'hover:opacity-100');
                };
                reader.readAsDataURL(file);
            }
        });

        // Theme Central Logic
        function updateThemeVisuals() {
            // Update Main Canvas
            if (theme === 'light') {
                canvasContainer.classList.remove('bg-[#1a1a19]', 'text-[#f4f0e6]'); 
                canvasContainer.classList.add('bg-[#f4f0e6]', 'text-[#1a1a19]');
            } else {
                canvasContainer.classList.remove('bg-[#f4f0e6]', 'text-[#1a1a19]'); 
                canvasContainer.classList.add('bg-[#1a1a19]', 'text-[#f4f0e6]');
            }

            // Update Physical Stack Pages
            document.querySelectorAll('.stack-page').forEach(el => {
                if (theme === 'light') {
                    el.classList.remove('dark-theme');
                    el.classList.add('light-theme');
                } else {
                    el.classList.remove('light-theme');
                    el.classList.add('dark-theme');
                }
            });
        }

        btnTheme.addEventListener('click', () => {
            theme = theme === 'dark' ? 'light' : 'dark';
            updateThemeVisuals();
        });

        // Master UI Sync
        function updateUI() {
            if (activePageIndex === 0) {
                pageIndicator.textContent = 'Cover Slide'; coverView.classList.remove('hidden'); textView.classList.add('hidden');
                toolbar.classList.add('hidden'); deleteText.textContent = 'Remove Cover';
                charCountDisplay.textContent = `0 / ${MAX_CHARS} Chars`;
                charCountDisplay.className = 'font-bold transition-colors text-engraved';
            } else {
                pageIndicator.textContent = `Slide ${activePageIndex} of ${pages.length - 1}`;
                coverView.classList.add('hidden'); textView.classList.remove('hidden');
                toolbar.classList.remove('hidden'); toolbar.classList.add('flex');
                editor.innerHTML = pages[activePageIndex] || ''; deleteText.textContent = 'Clear Slide';
                updateCharCount();
            }
            
            // Trigger the Stack Physics Engine to build or toss pages
            syncStack(activePageIndex);

            btnPrev.disabled = activePageIndex === 0; btnNext.disabled = activePageIndex === pages.length - 1; btnAdd.disabled = pages.length >= MAX_PAGES;
        }

        function updateCharCount() {
            if (activePageIndex === 0) return;
            const textLen = editor.textContent.length;
            charCountDisplay.textContent = `${textLen} / ${MAX_CHARS} Chars`;
            charCountDisplay.className = textLen >= MAX_CHARS ? 'font-bold laser-active transition-colors text-engraved' : 'font-bold transition-colors text-engraved';
        }

        /* --- Configuring immersive background controls... --- */
        // Places Logic
        function setRandomPlace() {
            if (placesImages.length === 0) return;
            const randomIndex = Math.floor(Math.random() * placesImages.length);
            const imgUrl = placesImages[randomIndex];
            
            const tempImg = new Image();
            tempImg.onload = () => {
                if (tempImg.width === 161) { // Filter out dead Imgur links
                    placesImages.splice(randomIndex, 1);
                    setRandomPlace(); 
                    return;
                }
                placesBg.style.backgroundImage = `url('${imgUrl}')`;
                placesBg.style.opacity = '1';
            };
            tempImg.onerror = () => {
                placesImages.splice(randomIndex, 1);
                setRandomPlace(); 
            };
            tempImg.src = imgUrl;
        }

        btnPlaces.addEventListener('click', () => {
            placesModeActive = !placesModeActive;
            if (placesModeActive) {
                placesBg.style.opacity = '0'; 
                setRandomPlace();
                placesBgContainer.classList.remove('opacity-0', 'pointer-events-none');
                placesControls.classList.remove('hidden');
                placesControls.classList.add('flex');
                btnPlaces.classList.add('laser-active');
            } else {
                placesBgContainer.classList.add('opacity-0', 'pointer-events-none');
                placesControls.classList.add('hidden');
                placesControls.classList.remove('flex');
                btnPlaces.classList.remove('laser-active');
            }
        });

        btnPlacesShuffle.addEventListener('click', () => {
            placesBg.style.opacity = '0';
            setTimeout(() => { setRandomPlace(); }, 300);
        });
        
        focusSlider.addEventListener('input', (e) => { 
            placesBg.style.filter = `blur(${e.target.value}px)`; 
        });
        zoomSlider.addEventListener('input', (e) => { 
            placesBg.style.transform = `scale(${e.target.value / 100})`; 
        });

        // Weather Logic — original thin rain, no clouds
        function resizeWeatherCanvas() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            if (weatherCanvas.width !== w) weatherCanvas.width = w;
            if (weatherCanvas.height !== h) weatherCanvas.height = h;
            weatherCanvas.style.width = w + 'px';
            weatherCanvas.style.height = h + 'px';
        }
        window.addEventListener('resize', resizeWeatherCanvas);
        resizeWeatherCanvas();

        function createRain() {
            rainDrops = [];
            for (let i = 0; i < 150; i++) {
                rainDrops.push({
                    x: Math.random() * weatherCanvas.width,
                    y: Math.random() * weatherCanvas.height,
                    length: Math.random() * 20 + 10,
                    speed: Math.random() * 10 + 15,
                    opacity: Math.random() * 0.3 + 0.1,
                    angle: 0.1
                });
            }
        }

        function animateRain() {
            resizeWeatherCanvas();
            ctxWeather.clearRect(0, 0, weatherCanvas.width, weatherCanvas.height);
            ctxWeather.lineWidth = 1;
            ctxWeather.lineCap = 'round';

            rainDrops.forEach(drop => {
                ctxWeather.beginPath();
                ctxWeather.moveTo(drop.x, drop.y);
                ctxWeather.lineTo(drop.x + (drop.angle * drop.length), drop.y + drop.length);
                ctxWeather.strokeStyle = `rgba(180, 210, 255, ${drop.opacity})`;
                ctxWeather.stroke();

                drop.y += drop.speed;
                drop.x += drop.angle * drop.speed;

                if (drop.y > weatherCanvas.height) {
                    drop.y = -drop.length;
                    drop.x = Math.random() * weatherCanvas.width;
                }
            });

            if (weatherActive) rainAnimationId = requestAnimationFrame(animateRain);
        }

        btnWeather.addEventListener('click', () => {
            weatherActive = !weatherActive;
            if (weatherActive) {
                btnWeather.classList.add('laser-active');
                weatherCanvas.classList.remove('opacity-0');
                resizeWeatherCanvas();
                createRain();
                animateRain();
            } else {
                btnWeather.classList.remove('laser-active');
                weatherCanvas.classList.add('opacity-0');
                setTimeout(() => { if (!weatherActive) cancelAnimationFrame(rainAnimationId); }, 1000);
            }
        });

        /* --- Configuring the dictionary API... --- */
        btnDictionary.addEventListener('click', () => { dictionaryPanel.classList.remove('translate-x-full'); setTimeout(() => dictSearchInput.focus(), 100); });
        btnCloseDict.addEventListener('click', () => { dictionaryPanel.classList.add('translate-x-full'); });

        dictSearchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') { const word = dictSearchInput.value.trim(); if (word) fetchDefinition(word); }
        });

        async function fetchDefinition(word) {
            dictResults.innerHTML = `<div class="text-center text-neutral-400 mt-10"><i class="ph ph-spinner animate-spin text-4xl mb-3 text-blue-500"></i><p>Searching the archives...</p></div>`;
            try {
                const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
                if (!response.ok) throw new Error('Word not found');
                const data = await response.json(); const entry = data[0];
                let html = `<div class="mb-2 border-b border-neutral-800 pb-4"><h3 class="text-3xl font-extrabold text-white tracking-tight">${entry.word}</h3>${entry.phonetic ? `<p class="text-blue-400 font-medium text-lg mt-1">${entry.phonetic}</p>` : ''}</div>`;
                
                entry.meanings.forEach(meaning => {
                    html += `<div class="mb-4"><div class="inline-block px-2 py-1 bg-neutral-800 text-xs font-bold uppercase tracking-wider text-neutral-300 rounded mb-3">${meaning.partOfSpeech}</div><ul class="list-disc pl-5 text-neutral-300 space-y-3">`;
                    meaning.definitions.slice(0, 4).forEach(def => {
                        html += `<li><span class="text-neutral-200">${def.definition}</span>`;
                        if (def.example) html += `<br><span class="text-neutral-500 italic text-sm mt-1 block">"${def.example}"</span>`;
                        html += `</li>`;
                    });
                    html += `</ul>`;
                    if (meaning.synonyms && meaning.synonyms.length > 0) {
                        html += `<div class="mt-4 text-sm bg-neutral-900 p-3 rounded-lg border border-neutral-800"><span class="text-neutral-500 font-medium">Synonyms: </span><span class="text-blue-400">${meaning.synonyms.slice(0, 6).join(', ')}</span></div>`;
                    }
                    html += `</div>`;
                });
                dictResults.innerHTML = html;
            } catch (error) {
                dictResults.innerHTML = `<div class="text-center text-neutral-500 mt-10"><i class="ph ph-warning-circle text-5xl mb-3 text-red-400 opacity-80"></i><p>We couldn't find a definition for "<span class="text-white">${word}</span>".</p><p class="text-sm mt-2 opacity-70">Check your spelling or try another word.</p></div>`;
            }
        }

        /* --- Configuring Printing Press logic and exporting... --- */
        let isDraggingLever = false;
        let leverStartY = 0;
        let leverCurrentY = 0;
        const leverTrackLength = 170; // Physical pixel distance to pull

        // Open Lever Modal
        btnExport.addEventListener('click', () => {
            leverModal.classList.remove('hidden');
            setTimeout(() => leverModal.classList.remove('opacity-0'), 10);
        });

        // Close Lever Modal
        btnCancelPrint.addEventListener('click', () => {
            leverModal.classList.add('opacity-0');
            setTimeout(() => leverModal.classList.add('hidden'), 500);
        });

        // Lever Drag Mechanics
        const startDrag = (e) => {
            isDraggingLever = true;
            leverStartY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            leverHandle.style.transition = 'none';
        };

        const doDrag = (e) => {
            if(!isDraggingLever) return;
            const y = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            let delta = y - leverStartY;
            
            if (delta < 0) delta = 0;
            if (delta > leverTrackLength) delta = leverTrackLength;
            
            leverCurrentY = delta;
            leverHandle.style.transform = `translate(-50%, ${leverCurrentY}px)`;
            
            if (leverCurrentY >= leverTrackLength - 5) {
                // TRIGGER THE MACHINE
                isDraggingLever = false;
                leverModal.classList.add('opacity-0');
                setTimeout(() => leverModal.classList.add('hidden'), 500);
                leverHandle.style.transform = `translate(-50%, 0px)`; 
                startPrintingProcess();
            }
        };

        const endDrag = () => {
            if(!isDraggingLever) return;
            isDraggingLever = false;
            // Snap back animation if not fully pulled
            leverHandle.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            leverHandle.style.transform = `translate(-50%, 0px)`;
        };

        // Bind Lever Events (Mouse & Touch)
        leverHandle.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', doDrag);
        document.addEventListener('mouseup', endDrag);
        
        leverHandle.addEventListener('touchstart', startDrag, {passive: false});
        document.addEventListener('touchmove', doDrag, {passive: false});
        document.addEventListener('touchend', endDrag);

        // Core 1:1 WYSIWYG Export Engine
        async function startPrintingProcess() {
            showToast('The Printing Press is running...');
            btnExport.disabled = true; btnExport.classList.add('opacity-50');
            const zip = new JSZip(); 
            
            const visualCanvas = document.getElementById('canvas-container');
            const renderScale = 1080 / visualCanvas.clientWidth; // Scales physical box to 1080p
            
            // Store original state to restore later
            const originalClasses = visualCanvas.className;
            const originalTransition = visualCanvas.style.transition;
            const originalPageIndex = activePageIndex;
            
            // Strip styles that cause visual artifacts in html2canvas
            visualCanvas.style.transition = 'none';
            visualCanvas.classList.remove('rounded-lg', 'border', 'border-neutral-800', 'shadow-2xl');
            
            // Turn on the machine shake
            mainApp.classList.add('animate-print-shake');

            try {
                // Toss entire stack first to prepare for printing loop
                syncStack(0);
                await new Promise(resolve => setTimeout(resolve, 700));

                for (let i = 0; i < pages.length; i++) {
                    // Update state to step through the stack physically
                    activePageIndex = i;
                    updateUI(); // This auto-builds the stack behind as we scan!
                    
                    // Wait for the stack building animation 
                    await new Promise(resolve => setTimeout(resolve, 400)); 

                    // Create and append the physical print head scanner
                    const scanner = document.createElement('div');
                    scanner.className = 'print-scanner';
                    visualCanvas.appendChild(scanner);

                    // Wait for the scanner to sweep down the page
                    await new Promise(resolve => setTimeout(resolve, 800)); 
                    
                    // Briefly pause machine shake for a crystal clear HD photo
                    mainApp.classList.remove('animate-print-shake');
                    visualCanvas.removeChild(scanner);

                    // Capture exactly what is rendered on screen
                    const canvas = await html2canvas(visualCanvas, { 
                        scale: renderScale, 
                        useCORS: true, 
                        backgroundColor: theme === 'light' ? '#f4f0e6' : '#1a1a19'
                    });
                    
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                    zip.file(`${String(i + 1).padStart(2, '0')}_slide.png`, blob);
                    
                    // Resume machine shake for the next page
                    if(i < pages.length - 1) {
                        mainApp.classList.add('animate-print-shake');
                    }
                }

                // Compile and Download ZIP
                const zipContent = await zip.generateAsync({ type: 'blob' });
                const link = document.createElement('a'); 
                link.href = URL.createObjectURL(zipContent);
                link.download = 'The_Audrey_No_1_Export.zip'; 
                link.click();
                showToast('Printing complete. Files downloaded.');
            } catch (error) {
                console.error("Export failed:", error); 
                showToast('Machine jammed. See console for details.');
            } finally {
                // Shut down the machine and restore UI
                mainApp.classList.remove('animate-print-shake');
                visualCanvas.className = originalClasses;
                visualCanvas.style.transition = originalTransition;
                
                activePageIndex = originalPageIndex;
                updateUI();
                
                btnExport.disabled = false; 
                btnExport.classList.remove('opacity-50');
            }
        }


        /* --- AUDREY NO. 1 ENGINE PHYSICS --- */
        (function () {
            const fanLeft = document.getElementById('fan-left');
            const fanRight = document.getElementById('fan-right');
            const pistonLeft = document.getElementById('piston-left');
            const pistonRight = document.getElementById('piston-right');
            const writerEditor = document.getElementById('editor');

            if (!fanLeft || !fanRight || !pistonLeft || !pistonRight || !writerEditor) return;

            let engineVelocity = 0;
            const MAX_VELOCITY = 12;
            const FRICTION_DECAY = 0.045;
            const GEAR_RATIO = 5;
            const KEY_IMPULSE = 1.05;
            const PISTON_REST = 50;
            const PISTON_STROKE = 16;

            let currentFanAngle = 0;

            writerEditor.addEventListener('input', function () {
                engineVelocity += KEY_IMPULSE;
                if (engineVelocity > MAX_VELOCITY) engineVelocity = MAX_VELOCITY;
            });

            function runEnginePhysics() {
                if (engineVelocity > 0) engineVelocity -= FRICTION_DECAY;
                if (engineVelocity < 0) engineVelocity = 0;

                currentFanAngle += engineVelocity;

                fanLeft.style.transform = 'translate(-50%, -50%) rotate(' + currentFanAngle + 'deg)';
                fanRight.style.transform = 'translate(-50%, -50%) rotate(' + currentFanAngle + 'deg)';

                const shaftPhase = (currentFanAngle / GEAR_RATIO) * (Math.PI / 180);
                const throwY = Math.sin(shaftPhase) * PISTON_STROKE;
                pistonLeft.style.top = (PISTON_REST + throwY) + '%';
                pistonRight.style.top = (PISTON_REST - throwY) + '%';
                pistonLeft.style.transform = 'translate(-50%, -50%)';
                pistonRight.style.transform = 'translate(-50%, -50%)';

                requestAnimationFrame(runEnginePhysics);
            }

            runEnginePhysics();
        })();
    </script>
</body>
</html>
